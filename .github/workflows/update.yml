name: Refresh & deploy market-watch

on:
  schedule:
    # 每天早 / 中 / 晚各跑一次（用户口径），错开整点避免队列拥堵：
    #  - 08:17 北京 = 00:17 UTC  早盘前 / 隔夜美股财报
    #  - 12:17 北京 = 04:17 UTC  A股午间休市 / 早间快讯
    #  - 20:17 北京 = 12:17 UTC  美股盘前 / 港股收盘后 / 晚间复盘
    - cron: "17 0 * * *"
    - cron: "17 4 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [refresh]

permissions:
  contents: write   # 用于把每日情绪历史回写仓库
  pages: write      # 用于发布 Pages
  id-token: write

concurrency:
  group: market-watch-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch history (rates.js, monthly)
        run: python fetch_history.py --if-stale 1

      - name: Fetch liquidity (liquidity.js, daily)
        timeout-minutes: 6
        run: |
          # FRED + CFTC；脚本内部有抓取预算与 curl 优先策略，任一源失败都不阻断整站发布
          python fetch_liquidity.py --if-stale 1 || echo "[warn] fetch_liquidity 失败，沿用旧 liquidity.js"

      - name: Fetch reserves (reserves.js, weekly)
        run: python fetch_reserves.py --if-stale 1 || echo "[warn] fetch_reserves 失败，沿用旧 reserves.js"

      # ---------- 财报分析（Pi Agent + Gemini） ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Pi Agent
        run: npm install -g @mariozechner/pi-coding-agent

      - name: Fetch earnings data (SEC EDGAR + 东方财富 A股/港股)
        run: python fetch_earnings.py || echo "[warn] fetch_earnings 失败，沿用旧 earnings_raw.json"

      - name: Run Pi Agent earnings analysis
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p dist/earnings
          # 注入 GEMINI key；若 Secrets 未配置则跳过（不阻断整站发布）
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "[warn] GEMINI_API_KEY 未配置，跳过财报分析（Secrets 需设置）"
            exit 0
          fi
          pi --provider google --model "gemini-3-flash-preview" -p "$(cat prompt.md)" \
            || echo "[warn] pi 分析失败，沿用旧 dist/earnings/index.html"

      - name: Fetch market data
        run: |
          # 东财对境外 runner 偶发整段 502：整轮重试最多 3 次，失败也尽量由兜底快照兜住
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            if python fetch_market.py; then
              exit 0
            fi
            sleep 20
          done
          echo "all attempts failed"
          exit 1

      - name: Persist daily history (once per trading day, clean data only)
        run: |
          SHOULD=$(python3 - <<'PY'
          import json, subprocess
          try:
              latest = json.load(open("data/latest.json"))
              meta = latest.get("meta", {})
              hist = json.load(open("data/history.json"))
          except Exception:
              print(0); raise SystemExit
          if meta.get("state") != "已收盘" or meta.get("degraded"):
              print(0); raise SystemExit
          if not hist or not hist[-1].get("amount"):
              print(0); raise SystemExit
          today = hist[-1]["date"]
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/history.json"]))
          except Exception:
              old = []
          import os
          fb_ok = os.path.exists("data/fallback.json") and os.path.getsize("data/fallback.json") > 200
          print(0 if (today in {x.get("date") for x in old} and fb_ok) else 1)
          PY
          )
          if [ "$SHOULD" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json data/fallback.json
            git commit -m "chore: 记录 $(TZ=Asia/Shanghai date '+%F') 的 A股历史与兜底快照"
            git pull --rebase --autostash origin main
            git push
          else
            echo "history: skip (intraday / degraded / already recorded)"
          fi

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html cycle.html liquidity.html reserves.html README.md data.js rates.js site/
          cp liquidity.js site/ 2>/dev/null || echo "[warn] liquidity.js 缺失，liquidity.html 将提示数据未加载"
          cp reserves.js site/ 2>/dev/null || echo "[warn] reserves.js 缺失，reserves.html 将提示数据未加载"
          # 财报分析页（Pi Agent 生成，含免责声明）
          mkdir -p site/earnings
          cp dist/earnings/index.html site/earnings/index.html 2>/dev/null \
            || echo "[warn] dist/earnings/index.html 缺失，/earnings/ 将 404"
          ls -la site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
