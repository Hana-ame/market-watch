name: Refresh & deploy market-watch

on:
  schedule:
    # UTC；每 15 分钟尝试刷新并部署一次（GitHub 调度可能延迟 5–20 分钟）
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # 用于把每日情绪历史回写仓库
  pages: write      # 用于发布 Pages
  id-token: write

concurrency:
  group: market-watch-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python fetch_market.py

      - name: Persist daily history (once per trading day, clean data only)
        run: |
          SHOULD=$(python3 - <<'PY'
          import json, subprocess
          try:
              latest = json.load(open("data/latest.json"))
              meta = latest.get("meta", {})
              hist = json.load(open("data/history.json"))
          except Exception:
              print(0); raise SystemExit
          if meta.get("state") != "已收盘" or meta.get("degraded"):
              print(0); raise SystemExit
          if not hist or not hist[-1].get("amount"):
              print(0); raise SystemExit
          today = hist[-1]["date"]
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/history.json"]))
          except Exception:
              old = []
          print(0 if today in {x.get("date") for x in old} else 1)
          PY
          )
          if [ "$SHOULD" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: 记录 $(TZ=Asia/Shanghai date '+%F') 的 A股情绪历史"
            git pull --rebase --autostash origin main
            git push
          else
            echo "history: skip (intraday / degraded / already recorded)"
          fi

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html README.md data.js site/
          ls -la site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
