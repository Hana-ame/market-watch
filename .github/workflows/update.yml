name: Refresh & deploy market-watch

on:
  schedule:
    # UTC 15:10 = 北京时间 23:10；每天一次，取「A股收盘 + 国内夜盘 + 美盘早段」的当日快照
    # GitHub schedule 为 best-effort，漏跑时由本机看门狗/Windows 任务 dispatch 兜底
    - cron: "10 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [refresh]

permissions:
  contents: write   # 用于把每日情绪历史回写仓库
  pages: write      # 用于发布 Pages
  id-token: write

concurrency:
  group: market-watch-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: |
          # 东财对境外 runner 偶发整段 502：整轮重试最多 3 次，失败也尽量由兜底快照兜住
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            if python fetch_market.py; then
              exit 0
            fi
            sleep 20
          done
          echo "all attempts failed"
          exit 1

      - name: Persist daily history (once per trading day, clean data only)
        run: |
          SHOULD=$(python3 - <<'PY'
          import json, subprocess
          try:
              latest = json.load(open("data/latest.json"))
              meta = latest.get("meta", {})
              hist = json.load(open("data/history.json"))
          except Exception:
              print(0); raise SystemExit
          if meta.get("state") != "已收盘" or meta.get("degraded"):
              print(0); raise SystemExit
          if not hist or not hist[-1].get("amount"):
              print(0); raise SystemExit
          today = hist[-1]["date"]
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/history.json"]))
          except Exception:
              old = []
          import os
          fb_ok = os.path.exists("data/fallback.json") and os.path.getsize("data/fallback.json") > 200
          print(0 if (today in {x.get("date") for x in old} and fb_ok) else 1)
          PY
          )
          if [ "$SHOULD" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json data/fallback.json
            git commit -m "chore: 记录 $(TZ=Asia/Shanghai date '+%F') 的 A股历史与兜底快照"
            git pull --rebase --autostash origin main
            git push
          else
            echo "history: skip (intraday / degraded / already recorded)"
          fi

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html README.md data.js site/
          ls -la site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
