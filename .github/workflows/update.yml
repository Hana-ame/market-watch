name: Refresh & deploy market-watch

on:
  schedule:
    # 实测 GitHub Actions 免费公共仓库 schedule 不可靠：3 个离散 cron 每天只触发 1 次且延迟数小时
    #（高峰/低活跃仓库节流）。改用连续窗口 cron（每 6h 一个窗口，GitHub 在窗口内调度，比离散点
    # 错过即失效更可靠）：UTC 01:17/09:17/17:17 = 北京 09:17/17:17/次日 01:17，覆盖早/晚/夜。
    # 若仍节流，至少保证每天 ≥1 次（兜底），push/workflow_dispatch 仍可手动触发。
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [refresh]

permissions:
  contents: write   # 用于把每日情绪历史回写仓库
  pages: write      # 用于发布 Pages
  id-token: write

concurrency:
  group: market-watch-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch history (rates.js, monthly)
        run: python fetch_history.py --if-stale 1

      - name: Fetch liquidity (liquidity.js, daily)
        timeout-minutes: 6
        run: |
          # FRED + CFTC；脚本内部有抓取预算与 curl 优先策略，任一源失败都不阻断整站发布
          python fetch_liquidity.py --if-stale 1 || echo "[warn] fetch_liquidity 失败，沿用旧 liquidity.js"

      - name: Fetch reserves (reserves.js, weekly)
        run: python fetch_reserves.py --if-stale 1 || echo "[warn] fetch_reserves 失败，沿用旧 reserves.js"

      # ---------- 财报分析（Pi Agent + Gemini） ----------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Pi Agent
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Fetch earnings data (SEC EDGAR + 东方财富 A股/港股)
        run: python fetch_earnings.py || echo "[warn] fetch_earnings 失败，沿用旧 earnings_raw.json"

      - name: Render earnings page (deterministic, no LLM)
        # 不再用 Pi Agent/Gemini 生成：实测 LLM 会编造点评——把真实数字丢掉、
        # 写成「现金流极其强劲」等无根据套话，甚至对缺数据的公司凭空点评。
        # 改为确定性渲染：数字直接来自 earnings_raw.json，点评用规则从数字推导。
        run: python build_earnings.py || echo "[warn] build_earnings 失败，沿用旧 earnings 页"

      - name: Fetch market data
        run: |
          # 东财对境外 runner 偶发整段 502：整轮重试最多 3 次，失败也尽量由兜底快照兜住
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            if python fetch_market.py; then
              exit 0
            fi
            sleep 20
          done
          echo "all attempts failed"
          exit 1

      - name: Persist daily history (once per trading day, clean data only)
        run: |
          SHOULD=$(python3 - <<'PY'
          import json, subprocess
          try:
              latest = json.load(open("data/latest.json"))
              meta = latest.get("meta", {})
              hist = json.load(open("data/history.json"))
          except Exception:
              print(0); raise SystemExit
          if meta.get("state") != "已收盘" or meta.get("degraded"):
              print(0); raise SystemExit
          if not hist or not hist[-1].get("amount"):
              print(0); raise SystemExit
          today = hist[-1]["date"]
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/history.json"]))
          except Exception:
              old = []
          import os
          fb_ok = os.path.exists("data/fallback.json") and os.path.getsize("data/fallback.json") > 200
          print(0 if (today in {x.get("date") for x in old} and fb_ok) else 1)
          PY
          )
          if [ "$SHOULD" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json data/fallback.json
            git commit -m "chore: 记录 $(TZ=Asia/Shanghai date '+%F') 的 A股历史与兜底快照"
            git pull --rebase --autostash origin main
            git push
          else
            echo "history: skip (intraday / degraded / already recorded)"
          fi

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html cycle.html liquidity.html reserves.html README.md data.js rates.js site/
          cp liquidity.js site/ 2>/dev/null || echo "[warn] liquidity.js 缺失，liquidity.html 将提示数据未加载"
          cp reserves.js site/ 2>/dev/null || echo "[warn] reserves.js 缺失，reserves.html 将提示数据未加载"
          # 财报分析页：优先用 Pi Agent 新产物，缺失则用仓库兜底页（保证 /earnings/ 始终可访问）
          mkdir -p site/earnings
          if [ -f dist/earnings/index.html ]; then
            cp dist/earnings/index.html site/earnings/index.html
            echo "[ok] 部署 Pi Agent 新生成的 earnings 页"
          elif [ -f earnings/index.html ]; then
            cp earnings/index.html site/earnings/index.html
            echo "[warn] pi 无新产物，部署仓库兜底 earnings 页"
          else
            echo "[warn] earnings 页缺失（dist/ 与 earnings/ 均无），/earnings/ 将 404"
          fi
          ls -la site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
